name: Update Singularity Dashboard Data

on:
  schedule:
    # Run daily at 6:00 AM UTC (1:00 AM EST)
    - cron: '0 6 * * *'
    # Also run weekly deep-pull on Sundays at 8:00 AM UTC
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force update all data sources (even manual ones)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run data update scripts
        env:
          SEC_USER_AGENT: "RationalOptimistSociety data@rationaloptimistsociety.com"
        run: |
          cd scripts

          echo "=== Fetching Epoch AI data (training compute + revenue) ==="
          python3 fetch_epoch_ai.py || echo "WARNING: Epoch AI fetch failed"

          echo ""
          echo "=== Fetching satellite data (CelesTrak) ==="
          python3 fetch_satellites.py || echo "WARNING: Satellite fetch failed"

          echo ""
          echo "=== Fetching solar energy data (Our World in Data) ==="
          python3 fetch_solar_energy.py || echo "WARNING: Solar energy fetch failed"

          echo ""
          echo "=== Fetching SEC EDGAR capex data ==="
          python3 fetch_sec_capex.py || echo "WARNING: SEC capex fetch failed"

          echo ""
          echo "=== Fetching transistor trend data (Karl Rupp) ==="
          python3 fetch_transistors.py || echo "WARNING: Transistor fetch failed"

          echo ""
          echo "=== Fetching AI pricing data ==="
          python3 fetch_ai_pricing.py || echo "WARNING: AI pricing fetch failed"

          echo ""
          echo "=== Fetching FDA gene therapy data ==="
          python3 fetch_fda_gene_therapy.py || echo "WARNING: FDA gene therapy fetch failed"

          echo ""
          echo "=== Merging all data into data.js ==="
          python3 update_data.py --merge-only || echo "WARNING: Master merge failed"

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data.js scripts/data/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "data@rationaloptimistsociety.com"
          git config --local user.name "ROS Data Bot"
          git add data.js scripts/data/
          git commit -m "$(cat <<'EOF'
          Auto-update: Singularity Dashboard data refresh

          Automated daily data pull from:
          - Epoch AI (training compute, revenue)
          - CelesTrak (satellite counts)
          - Our World in Data (solar energy)
          - SEC EDGAR (hyperscaler capex)
          - Karl Rupp (transistor trends)
          - AI provider pricing
          - FDA (gene therapy approvals)

          Generated by GitHub Actions
          EOF
          )"
          git push
